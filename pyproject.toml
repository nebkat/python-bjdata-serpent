[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "bjdata-serpent"
dynamic = ["version"]
description = "BJData (Binary JData) encoder and decoder, on the serpent C++ library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nebojša Cvetković" }]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
numpy = ["numpy>=1.25"]
test = ["pytest>=7"]

[project.urls]
Source = "https://github.com/nebkat/python-bjdata-serpent"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/bjdata_serpent"]
build-dir = "build/{wheel_tag}"
sdist.include = ["extern/cpp-serpent", "extern/cpp-unaligned"]
sdist.exclude = ["extern/*/build*", "extern/*/cmake-build*", "extern/*/site", "extern/*/benchmark", "extern/*/.git"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
