name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0  # tags, for the version

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # ubuntu-latest's default GCC 13 lacks std::ranges::to; 14 is installed beside it.
      - name: Use GCC 14
        if: runner.os == 'Linux'
        run: echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install
        run: pip install -v '.[test,numpy]'
        shell: bash

      - name: Test
        run: python -X faulthandler -m pytest -v --tb=short -p no:cacheprovider

  wheels:
    name: wheels (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: pypa/cibuildwheel@v3.3
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *_i686 *-musllinux_*"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -q {project}/tests

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build
        run: pipx run build --sdist

      # The sdist has to build on its own, with nothing fetched: both libraries are in it.
      - name: Build a wheel from it
        run: |
          pip install dist/*.tar.gz pytest
          pytest -q tests

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
